feature-chips span{font-size:14px;font-weight:800;padding:9px 11px;border:1px solid var(--stroke);border-radius:14px;background:#fff}.selector-label{font-size:14px;font-weight:900;color:var(--purple-deep);margin:0 0 9px}.modes{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}.mode{border:2px solid #ded3f3;background:white;color:var(--purple-deep);border-radius:16px;padding:12px 17px;font-weight:900;min-width:126px;transition:transform .15s,border .15s}.mode:hover,.mode[aria-pressed="true"]{border-color:var(--purple);background:#f0eaff}.mode[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--purple)}.btn{border:0;border-radius:17px;padding:15px 23px;font-size:17px;font-weight:900;display:inline-flex;gap:9px;align-items:center;justify-content:center;transition:transform .15s,filter .15s;min-height:54px}.btn:hover{transform:translateY(-2px);filter:brightness(1.03)}.btn-primary{background:var(--purple);color:white;box-shadow:0 6px 0 #41227f}.btn-secondary{color:var(--purple);background:var(--lilac);border:1px solid #ded0fa}.btn-ghost{background:white;color:var(--purple);border:1px solid var(--stroke)}.btn-full{width:100%}.helper{margin:19px 0 0;color:var(--muted);font-size:13px;max-width:410px}.hero-art{position:relative;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#e7ddff 0%,#fbf7ff 65%,#ffeedc 100%);border-radius:46% 0 0 46%}.blob{position:absolute;width:430px;height:430px;background:rgba(93,52,172,.11);border-radius:44% 56% 60% 40%;transform:rotate(-22deg)}.float{position:absolute;display:flex;align-items:center;gap:8px;background:white;border:1px solid #e4d5f9;box-shadow:0 8px 24px rgba(74,42,136,.11);color:var(--purple);border-radius:14px;padding:11px 13px;font-weight:900;font-size:15px;z-index:2}.float.one{top:17%;left:6%;transform:rotate(-6deg)}.float.two{top:29%;right:4%;transform:rotate(5deg)}.float.three{bottom:17%;right:6%;transform:rotate(-4deg)}.bot{width:min(86%,440px);height:auto;position:relative;z-index:1;f rder-radius:15px;font-weight:800;margin-bottom:25px}.results{padding:35px 45px 47px;text-align:center}.result-icon{font-size:73px;margin:0 0 10px}.results h2{font-size:clamp(31px,5vw,55px);letter-spacing:-1.4px;margin:0;color:var(--purple-deep)}.results .sub{font-size:18px;color:var(--muted);margin:12px 0 28px}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:700px;margin:0 auto 28px}.stat{border:1px solid var(--stroke);background:#f8f5ff;border-radius:21px;padding:18px 8px}.stat b{display:block;font-size:clamp(22px,4vw,37px);color:var(--purple);letter-spacing:-1px}.stat small{font-size:13px;color:#6e6183;font-weight:800}.prompt-gift{margin:0 auto 25px;max-width:730px;text-align:left;background:#f6f0ff;border:1px solid #dacaf6;border-radius:22px;padding:22px 24px}.prompt-gift strong{color:var(--purple);font-size:19px}.prompt-gift p{font-size:17px;margin:11px 0 15px}.prompt-gift button{background:white;color:var(--purple);border:1px solid var(--stroke);border-radius:12px;padding:9px 13px;font-weight:900}.results-buttons{display:flex;flex-wrap:wrap;gap:11px;justify-content:center}.privacy-note{color:#8b8199;font-size:12px;text-align:center;padding:20px}.toast{position:fixed;z-index:50;bottom:25px;left:50%;transform:translateX(-50%);padding:11px 18px;border-radius:14px;background:#322159;color:white;box-shadow:0 10px 25px #3e266044;font-weight:800;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}.confetti{pointer-events:none;position:fixed;z-index:3;left:0;top:0;width:100vw;height:100vh;overflow:hidden}.confetti span{position:absolute;top:-30px;animation:fall 1.4s ease-in forwards;width:11px;height:16px;background:var(--orange)}@keyframes fall{to{transform:translateY(110vh) rotate(620deg);opacity:0}}.intro-check{display:flex;gap:10px;align-items:center;margin-bottom:10px;color:#786a8b;font-size:14px}.intro-check:before{content:'✓';display:grid;place-items:center;color:#2b7865;background:#def8ec;border-radius:50%;width:23px;height:23px;flex:none;font-weight:900}.rules{text-align:left;max-width:670px;margin:18px auto 26px;display:grid;gap:9px}.rule{display:flex;gap:12px;align-items:flex-start;padding:13px;border-radius:14px;background:#faf7ff;color:#5f536d;font-weight:800}.rule span{font-size:22px;line-height:1}.footer-short{font-size:13px;color:#8b7e9d;text-align:center;margin-top:24px}.timeup{border-radius:12px;color:#8f4c21;background:#fff3e9;padding:10px 13px;font-size:14px;font-weight:800;margin-top:14px}.hidden{display:none!important}@media(max-width:780px){.site{padding:8px 10px 22px}.hero{display:flex;flex-direction:column-reverse;min-height:0}.hero-copy{padding:25px 22px 30px}.hero-art{height:280px;border-radius:0 0 30% 30%}.bot{width:235px}.float{font-size:12px;padding:7px}.float.one{top:13%;left:7%}.float.two{top:20%;right:6%}.float.three{bottom:15%;right:7%}.hero h1{margin:12px 0 10px;font-size:clamp(39px,10vw,58px)}.lead{font-size:18px}.modes{width:100%}.mode{flex:1;min-width:0}.hud{padding:14px 16px}.mission-area{padding:23px 20px 28px;min-height:600px}.answers .answer{padding:15px 13px;font-size:16px}.bottom-actions{flex-direction:column;align-items:stretch}.bottom-actions .btn{width:100%}.results{padding:30px 18px}.scene{padding:14px}.scene-icon{font-size:29px}.stat-grid{gap:6px}.stat{padding:15px 4px}.stat small{font-size:11px}.top-chip{font-size:11px;padding:7px 8px}.brand{font-size:18px}.brand-glyph{width:38px;height:38px;font-size:22px}}@media(max-width:420px){.top-chip{display:none}.hud-left{gap:5px}.mission-area{min-height:650px}.q-text{font-size:24px}.hero-art{height:238px}.float{font-size:10px}.bot{width:212px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<body>
<div class="site">
  <header class="top"><div class="brand"><span class="brand-glyph" aria-hidden="true">✦</span><span>НЕЙРО<span style="color:#8665d0">ЛАБ</span></span></div><span class="top-chip">Тренировка для 1–4 классов</span></header>
  <main id="app" class="screen" aria-live="polite"></main>

<script>
'use strict';
const GAME_KEY='neurolab-mini10-v1';
const TOTAL=12; const MAX=120; const DURATION=600;
const STAGES=[
  {icon:'🎨',title:'Портал картинок',subtitle:'Делаем понятные картинки',color:'#ede5ff',success:'Ты научился объяснять, какую картинку хочешь получить!'},
  {icon:'🎬',title:'Видеостудия',subtitle:'Управляем героем и камерой',color:'#fff1e4',success:'Камера слушается режиссёра, а герой знает свой жест!'},
  {icon:'🔎',title:'Детектив ИИ',subtitle:'Проверяем и думаем сами',color:'#e8f7f5',success:'Ты не веришь всему подряд и умеешь проверять ответы!'},
  {icon:'🧩',title:'Суперпромпт',subtitle:'Собираем хорошую команду',color:'#f1eaff',success:'У тебя получился свой маленький режиссёрский промпт!'}
];
// Every question: one right answer, one hint that explains why. First 9 test knowledge; last 3 construct a copyable prompt.
const BANK={
  junior:[
    {q:'Как попросить ИИ нарисовать кота-космонавта?',scene:'Ты открываешь мастерскую картинок.',opts:['Нарисуй что-нибудь.','Нарисуй рыжего кота в скафандре на Луне.','Сделай красиво.'],correct:1,why:'ИИ проще помочь, когда ты называешь героя и место.'},
    {q:'Нужна картинка БЕЗ надписей. Что добавить?',scene:'На картинке появляются случайные буквы.',opts:['Без текста и букв.','Пусть будет много всего.','Покрась в синий.'],correct:0,why:'Чтобы избежать лишних надписей, прямо попроси: «без текста».'},
    {q:'У героя получилось три руки. Как поступить?',scene:'На картинке есть ошибка — лишняя рука!',opts:['Ничего не менять.','Написать: «У персонажа две руки».','Удалить весь проект.'],correct:1,why:'Замечай ошибки и уточняй детали в запросе.'},
    {q:'Робот должен один раз помахать рукой. Какая команда лучше?',scene:'Картинка уже есть. Теперь сделаем короткое видео.',opts:['Сделай весёлое видео.','Пусть робот один раз плавно машет рукой.','Добавь много персонажей.'],correct:1,why:'Назови точное действие персонажа: «машет рукой».'},
    {q:'Камера должна медленно подъехать к герою. Что написать?',scene:'Хочется, чтобы герой стал ближе в кадре.',opts:['Камера медленно приближается к герою.','Камера быстро кружится.','Герой прыгает.'],correct:0,why:'Движение камеры описывается отдельно от движения героя.'},
    {q:'В видео у робота вдруг поменялась одежда. Что уточнить?',scene:'Вначале у робота жёлтый шарф, а в конце — красная куртка.',opts:['Добавь ещё одну шапку.','Сохрани внешность и одежду героя.','Пусть камера летает.'],correct:1,why:'Попроси сохранить неизменными лицо, одежду и фон.'},
    {q:'ИИ сказал: «На Луне растут бананы». Что делать?',scene:'Иногда нейросеть уверенно придумывает неправильные ответы.',opts:['Сразу всем рассказать.','Проверить информацию в надёжном источнике.','Никогда больше ничего не спрашивать.'],correct:1,why:'Ответы ИИ нужно проверять — он может ошибаться.'},
    {q:'Что НЕ стоит отправлять незнакомому ИИ?',scene:'Ты собираешься написать сообщение в чат.',opts:['Придуманный сюжет.','Идею для рисунка.','Пароль и домашний адрес.'],correct:2,why:'Личные данные и пароли не отправляют в случайные сервисы.'},
    {q:'ИИ сделал не ту картинку. Как помочь ему?',scene:'Вместо робота получился динозавр.',opts:['Уточнить запрос и повторить.','Обидеться на компьютер.','Всегда писать только «красиво».'],correct:0,why:'Хороший запрос можно улучшать шаг за шагом.'},
    {q:'Что поможет ИИ понять, КТО в кадре?',scene:'Собираем короткую команду для мини-сцены.',opts:['Красиво и круто.','Голубой робот в жёлтом шарфе.','Сделай срочно.'],correct:1,why:'У героя должны быть понятные приметы.',piece:'subject',value:'Голубой робот в жёлтом шарфе'},
    {q:'Что нужно сказать о движении героя?',scene:'У нашего робота есть одна простая задача.',opts:['Пусть робот один раз машет рукой.','Пусть происходит всё сразу.','Пусть ничего не понятно.'],correct:0,why:'Один чёткий жест легче получить в видео.',piece:'action',value:'один раз плавно машет рукой'},
    {q:'Как закончить команду про камеру?',scene:'Остался последний кусочек твоего промпта.',opts:['Сделай случайный эффект.','Камера бесконечно крутится.','Камера медленно приближается, без смены героя и фона.'],correct:2,why:'Плавная камера + постоянный герой = понятная мини-сцена.',piece:'camera',value:'Камера медленно приближается. Герой и фон не меняются.'}
  ],
  senior:[
    {q:'Заказ: «Нужна афиша школьного кинофестиваля». Какой промпт лучше?',scene:'Тебе нужно объяснить ИИ задачу дизайнера.',opts:['Сделай красивый постер.','Вертикальная афиша кинофестиваля: зал, проектор, место под дату; фиолетовый и оранжевый цвета, без лишнего текста.','Кино.'],correct:1,why:'Хороший промпт описывает задачу, композицию, цвета и ограничения.'},
    {q:'На изображении лицо героя обрезано. Что важнее уточнить?',scene:'Для видео нужна картинка, где видны лицо и рука.',opts:['Сделать персонажа по пояс, с открытым лицом и видимой рукой.','Добавить ещё десять героев.','Сделать фон громче.'],correct:0,why:'Композиция стартового кадра влияет на качество будущего движения.'},
    {q:'Как повысить шанс получить картинку без лишних надписей?',scene:'Нейросеть иногда пишет странные слова на постере.',opts:['Попросить рисовать быстрее.','Указать «без текста, надписей, логотипов и водяных знаков».','Написать «просто красиво».'],correct:1,why:'Явные ограничения помогают управлять результатом.'},
    {q:'Выбираем промпт для одного непрерывного видео. Какой точнее?',scene:'Робот приветствует зрителя, камера должна плавно ехать вперёд.',opts:['Робот машет правой рукой, камера медленно приближается; один непрерывный кадр.','Робот летит, падает и танцует; камера резко крутится.','Сделай модное видео.'],correct:0,why:'Один ясный жест + одно движение камеры уменьшают вероятность ошибок.'},
    {q:'Чем движение камеры отличается от движения героя?',scene:'Герой машет рукой, а зритель видит, что он становится крупнее.',opts:['Ничем: это одно и то же.','Герой машет, а камера отдельно приближается к нему.','Если герой машет, камера обязательно вращается.'],correct:1,why:'Жест относится к персонажу; приближение — к работе камеры.'},
    {q:'В результате камера начала вращаться. Как уточнить запрос?',scene:'Ты хотел плавное приближение, но получил круговой поворот.',opts:['Сделай ещё эффектнее!','Персонаж прыгает и меняет одежду.','Камера едет прямо вперёд и медленно, без вращения и резких переходов.'],correct:2,why:'Назови, что камера должна делать, и что нельзя менять.'},
    {q:'ИИ указал странный факт с точной датой. Как поступить?',scene:'Нейросети могут уверенно ошибаться даже в подробностях.',opts:['Проверить факт по нескольким надёжным источникам.','Повторить ответ как доказанный.','Доверять, если ответ звучит умно.'],correct:0,why:'Уверенный тон ИИ не заменяет проверку.'},
    {q:'Можно ли выдавать чужую работу за собственную?',scene:'Тебе попалась красивая иллюстрация другого автора.',opts:['Да, если никто не заметит.','Нет, чужое авторство нужно уважать и указывать.','Да, если заменить один цвет.'],correct:1,why:'Называй источники и не присваивай чужую работу.'},
    {q:'Почему полезно сохранять оба варианта промпта?',scene:'Первая версия дала ошибку, а вторая — хороший результат.',opts:['Потому что так красивее список.','Чтобы никогда не проверять результат.','Чтобы сравнить изменения и понять, что сработало.'],correct:2,why:'Сравнение версий помогает улучшать навыки работы с ИИ.'},
    {q:'Что точнее описывает героя для стартового кадра?',scene:'Собираем финальный промпт для мини-сцены.',opts:['Крутой персонаж.','Один голубой робот в жёлтом шарфе, вид по пояс, руки видны.','Много всего яркого.'],correct:1,why:'Укажи одного героя, его примету и крупность кадра.',piece:'subject',value:'Один голубой робот в жёлтом шарфе, вид по пояс, руки видны'},
    {q:'Какое действие подходит для короткой мини-сцены?',scene:'Персонаж должен поздороваться со зрителем.',opts:['Один раз медленно машет правой рукой, смотрит на зрителя.','Танцует, прыгает, летает и превращается в кота.','Делает что-нибудь интересное.'],correct:0,why:'Одно понятное движение легче контролировать.',piece:'action',value:'один раз плавно машет правой рукой, глядя на зрителя'},
    {q:'Какая команда сохраняет движение камеры и целостность сцены?',scene:'Нужен плавный подъезд без смены персонажа.',opts:['Камера резко вращается, одежда меняется.','Любой красивый монтаж.','Камера медленно движется вперёд; тот же герой, одежда, свет и фон; без склеек.'],correct:2,why:'Укажи точную траекторию и то, что должно остаться неизменным.',piece:'camera',value:'Камера медленно движется вперёд. Лицо, одежда, свет и фон не меняются. Без склеек.'}
  ]
};
const robotSvg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 420" role="img" aria-label="Дружелюбный фиолетовый робот"><ellipse cx="190" cy="390" rx="115" ry="18" fill="#9e86cb" opacity=".3"/><path d="M180 68V37" stroke="#55309c" stroke-width="13" stroke-linecap="round"/><circle cx="180" cy="27" r="17" fill="#f4a24c" stroke="#55309c" stroke-width="8"/><rect x="85" y="80" width="204" height="187" rx="73" fill="#fefcff" stroke="#5d34ac" stroke-width="13"/><rect x="103" y="102" width="170" height="126" rx="55" fill="#271347"/><ellipse cx="147" cy="165" rx="19" ry="22" fill="#8cf3eb"/><ellipse cx="224" cy="165" rx="19" ry="22" fill="#8cf3eb"/><path d="M159 196q29 28 55 0" stroke="#8cf3eb" stroke-width="12" fill="none" stroke-linecap="round"/><rect x="62" y="143" width="29" height="69" rx="15" fill="#936ed8" stroke="#5d34ac" stroke-width="7"/><rect x="285" y="143" width="29" height="69" rx="15" fill="#936ed8" stroke="#5d34ac" stroke-width="7"/><rect x="120" y="254" width="140" height="121" rx="37" fill="#fcfbff" stroke="#5d34ac" stroke-width="13"/><circle cx="190" cy="311" r="22" fill="#f8aa56" stroke="#5d34ac" stroke-width="7"/><path d="M120 293L81 302L59 337" fill="none" stroke="#5d34ac" stroke-width="23" stroke-linecap="round"/><path d="M261 293l36-46 27-40" fill="none" stroke="#5d34ac" stroke-width="23" stroke-linecap="round"/><circle cx="56" cy="344" r="17" fill="#fefcff" stroke="#5d34ac" stroke-width="7"/><path d="M307 210q19-23 22-42m-22 40q-7-23-20-33m21 33q22-9 36-4" fill="none" stroke="#fefcff" stroke-width="17" stroke-linecap="round"/><path d="M307 210q19-23 22-42m-22 40q-7-23-20-33m21 33q22-9 36-4" fill="none" stroke="#5d34ac" stroke-width="5" stroke-linecap="round"/><path d="M160 378l-9 24m64-24l10 24" stroke="#5d34ac" stroke-width="17" stroke-linecap="round"/><path d="M136 403h30m45 0h30" stroke="#5d34ac" stroke-width="12" stroke-linecap="round"/></svg>`;
const app=document.querySelector('#app'); const toastEl=document.querySelector('#toast');
let state=null, timerId=null, toastTimeout=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function save(){try{localStorage.setItem(GAME_KEY,JSON.stringify(state));}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(GAME_KEY));if(!s||!['junior','senior'].includes(s.mode)||!Number.isInteger(s.index)||s.index<0||s.index>TOTAL||!Array.isArray(s.answers)||s.answers.length>TOTAL||typeof s.startedAt!=='number')return null;return s;}catch(e){return null}}
function timeLeft(){return state?Math.max(0,DURATION-Math.floor((Date.now()-state.startedAt)/1000)):DURATION}
function timeString(){const s=timeLeft();return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function toast(txt){toastEl.textContent=txt;toastEl.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>toastEl.classList.remove('show'),2100)}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;document.querySelector('.confetti')?.remove();const el=document.createElement('div');el.className='confetti';document.body.append(el);for(let i=0;i<42;i++){const p=document.createElement('span');p.style.left=(Math.random()*100)+'%';p.style.background=['#5d34ac','#f58d37','#7fc6bc','#c3a8ef'][i%4];p.style.animationDelay=(Math.random()*.42)+'s';p.style.transform=`rotate(${Math.random()*360}deg)`;el.append(p)}setTimeout(()=>el.remove(),2500)}
function screenTop(){return `<div class="hud"><div class="hud-left"><span class="mission-pill">${esc(state.mode==='junior'?'1–2 классы':'3–4 классы')}</span><span class="timer ${timeLeft()<120?'warn':''}" id="timer" aria-label="Оставшееся время">⏱ ${timeString()}</span><span class="score-pill">⭐ ${state.score} / ${MAX}</span></div><button type="button" class="btn-ghost" id="restart" style="border-radius:12px;padding:7px 12px;font-size:13px;font-weight:900">↺ Начать заново</button><div class="progress-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="12" aria-valuenow="${state.answers.length}" aria-label="Прогресс игры"><div class="progress-fill" style="width:${state.answers.length/TOTAL*100}%"></div></div></div>`}
function clock(){const el=document.querySelector('#timer');if(!el)return;el.textContent='⏱ '+timeString();el.classList.toggle('warn',timeLeft()<120);if(timeLeft()===0&&!state.timeNotice){state.timeNotice=true;save();toast('10 минут прошли! Можно закончить игру без спешки.') }}
function launchTimer(){clearInterval(timerId);timerId=setInterval(clock,1000)}
function renderIntro(resume=false){app.innerHTML=`<div class="hero"><div class="hero-copy"><span class="eyebrow">✦ ИНТЕРАКТИВ НА 10 МИНУТ</span><h1>Секреты <span>ИИ!</span></h1><p class="lead">12 мини-заданий про картинки, видео и умные запросы. Прокачай навыки и получи звание нейроагента!</p><div class="feature-chips"><span>🎨 Картинки</span><span>🎬 Видео</span><span>🔎 Детектив</span><span>🧩 Промпты</span></div><div class="selector-label">Выбери свой уровень</div><div class="modes" role="group" aria-label="Выбор класса"><button class="mode" id="junior" type="button" aria-pressed="true">🌱 1–2 класс</button><button class="mode" id="senior" type="button" aria-pressed="false">🚀 3–4 класс</button></div><button class="btn btn-primary" type="button" id="start">Начать игру <span aria-hidden="true">→</span></button>${resume?'<button class="btn btn-secondary" style="margin-top:13px" id="continue" type="button">Продолжить игру</button>':''}<p class="helper">Не нужен аккаунт. Работает на компьютере, планшете и телефоне. Можно играть самостоятельно.</p></div><div class="hero-art"><div class="blob"></div><span class="float one">🎨 Рисуй!</span><span class="float two">🎬 Оживляй!</span><span class="float three">⭐ Побеждай!</span><div class="bot">${robotSvg}</div></div></div>`;
let selected='junior';const setMode=m=>{selected=m;app.querySelector('#junior').setAttribute('aria-pressed',String(m==='junior'));app.querySelector('#senior').setAttribute('aria-pressed',String(m==='senior'))};app.querySelector('#junior').onclick=()=>setMode('junior');app.querySelector('#senior').onclick=()=>setMode('senior');app.querySelector('#start').onclick=()=>{state={mode:selected,index:0,score:0,answers:[],startedAt:Date.now(),timeNotice:false,interstitial:false,done:false};save();launchTimer();render()};app.querySelector('#continue')?.addEventListener('click',()=>{state=load();if(!state){toast('Продолжить не удалось — начни новую игру.');return}launchTimer();render()});}
function render(){if(!state){renderIntro();return}if(state.done){renderEnd();return}if(state.interstitial){renderStage();return}renderQuestion()}
function attachCommon(){document.querySelector('#restart')?.addEventListener('click',()=>{if(window.confirm('Начать заново? Текущие баллы будут сброшены.')){state=null;clearInterval(timerId);try{localStorage.removeItem(GAME_KEY)}catch(e){}renderIntro()}});clock();}
function renderQuestion(){const q=BANK[state.mode][state.index];const stage=Math.floor(state.index/3);const selected=state.answers.find(a=>a.index===state.index);const chosen=(selected?.choice??null);app.innerHTML=screenTop()+`<div class="mission-area"><div class="mission-top"><span class="step-tag">${STAGES[stage].icon} ${esc(STAGES[stage].title)}</span><span class="step-counter">Задание ${state.index+1} из ${TOTAL}</span></div><h2 class="mission-title">${esc(STAGES[stage].subtitle)}</h2><div class="scene"><span class="scene-icon" aria-hidden="true">${STAGES[stage].icon}</span><span class="scene-text">${esc(q.scene)}</span></div><div class="q-label">Выбери один ответ</div><div class="q-text">${esc(q.q)}</div><div class="answers" role="group" aria-label="Варианты ответов">${q.opts.map((o,i)=>`<button type="button" class="answer ${chosen!==null?(i===q.correct?'correct':i===chosen?'wrong':''):''}" data-choice="${i}" ${chosen!==null?'disabled':''}><span class="letter" aria-hidden="true">${['А','Б','В'][i]}</span><span>${esc(o)}</span></button>`).join('')}</div>${chosen!==null?`<div class="feedback ${chosen===q.correct?'':'wrong'}" role="status"><strong>${chosen===q.correct?'✨ Верно! +10 звёзд':'💡 Почти! Правильный ответ подсвечен зелёным.'}</strong><p>${esc(q.why)}</p></div>`:''}<div class="bottom-actions"><span class="navhint">${stage===3?'🧩 Собираем финальную команду':'На ошибках тоже учатся!'}</span><button class="btn btn-primary" id="next" ${chosen===null?'disabled':''}>${(state.index+1)%3===0?(state.index===11?'Посмотреть результат →':'Завершить станцию →'):'Следующее задание →'}</button></div></div>`;
app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));app.querySelector('#next').onclick=next;attachCommon();}
function choose(i){if(state.answers.some(a=>a.index===state.index))return;const q=BANK[state.mode][state.index];state.answers.push({index:state.index,choice:i,correct:i===q.correct});if(i===q.correct)state.score+=10;save();renderQuestion()}
function next(){if(!state.answers.some(a=>a.index===state.index))return;const completedIdx=state.index;state.index++;if((completedIdx+1)%3===0&&state.index<TOTAL){state.interstitial=true}else if(state.index===TOTAL){state.done=true}save();if(state.done)confetti();render();window.scrollTo({top:0,behavior:'smooth'})}
function renderStage(){const index=Math.floor(state.index/3)-1;const st=STAGES[index];const inStage=state.answers.filter(a=>Math.floor(a.index/3)===index&&a.correct).length;app.innerHTML=screenTop()+`<div class="mission-area"><div class="stage-clear"><div class="stage-medal" aria-hidden="true">${st.icon}</div><span class="eyebrow">СТАНЦИЯ ${index+1} ИЗ 4 ПРОЙДЕНА</span><h2>${esc(st.title)} — готово!</h2><p>${esc(st.success)}</p><div class="stage-info">⭐ Твои верные ответы: ${inStage} из 3</div><br><button id="goStage" type="button" class="btn btn-primary">Вперёд: ${STAGES[index+1].icon} ${esc(STAGES[index+1].title)} →</button></div></div>`;app.querySelector('#goStage').onclick=()=>{state.interstitial=false;save();render();window.scrollTo({top:0,behavior:'smooth'})};attachCommon()}
function finalPrompt(){const p=BANK[state.mode].slice(9);const subject=p[0].value;const action=p[1].value;const camera=p[2].value;return `Используй загруженную картинку как первый кадр. ${subject} ${action}. ${camera} Плавное движение, одна сцена, без новых персонажей.`}
function renderEnd(){clearInterval(timerId);let correct=state.answers.filter(a=>a.correct).length;const mins=Math.min(10,Math.floor((Date.now()-state.startedAt)/60000));const title=correct>=10?'Нейроэксперт!':correct>=7?'Отличный нейроагент!':'Нейроисследователь!';const prompt=finalPrompt();app.innerHTML=screenTop()+`<div class="results"><div class="result-icon" aria-hidden="true">${correct>=10?'🏆':correct>=7?'🚀':'⭐'}</div><span class="eyebrow">МИССИЯ ЗАВЕРШЕНА</span><h2>${title}</h2><p class="sub">Ты прошёл 4 станции и потренировался работать с ИИ!</p><div class="stat-grid"><div class="stat"><b>${correct} / 12</b><small>верных ответов</small></div><div class="stat"><b>${state.score}</b><small>из 120 звёзд</small></div><div class="stat"><b>${mins} мин</b><small>прошло с начала</small></div></div><div class="prompt-gift"><strong>🎁 Бонус: промпт для твоей мини-сцены</strong><p id="gift">${esc(prompt)}</p><button type="button" id="copyPrompt">📋 Скопировать промпт</button></div><div class="results-buttons"><button type="button" id="copyResult" class="btn btn-secondary">📋 Скопировать результат</button><button type="button" id="again" class="btn btn-primary">↺ Сыграть ещё раз</button></div><div class="footer-short">Баллы не отправляются преподавателю автоматически — при необходимости покажи ему этот экран.</div></div>`;
app.querySelector('#copyPrompt').onclick=()=>copyText(prompt);app.querySelector('#copyResult').onclick=()=>copyText(`Моя миссия «НейроЛаб»: ${correct} из 12 верно, ${state.score} звёзд. Я прошёл 4 станции!`);app.querySelector('#again').onclick=()=>{state=null;try{localStorage.removeItem(GAME_KEY)}catch(e){}renderIntro();window.scrollTo({top:0,behavior:'smooth'})};attachCommon()}
async function copyText(t){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t)}else{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw Error('copy unsupported')}toast('Скопировано!')}catch(e){toast('Выдели текст и скопируй вручную.')}}
const saved=load();if(saved){state=saved;launchTimer();render()}else renderIntro();
</script>
</body>
