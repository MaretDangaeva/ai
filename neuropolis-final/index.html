<script>
(() => {
  'use strict';
  const DURATION = 20 * 60 * 1000;
  const MAX_Q_POINTS = 10;
  const STORAGE = 'neuropolis-final-run-v1';
  const districts = [
    {id:'prompt',name:'Промпт-квартал',short:'ПРОМПТЫ',symbol:'⌘',lessons:'1–5',description:'Роли, структура запросов, галлюцинации'},

  const MAX = questions.length * MAX_Q_POINTS;
  const app = document.getElementById('app');
  const timer = document.getElementById('timer');
  const timerValue = document.getElementById('timerValue');
  const emptyState = () => ({screen:'intro',name:'',startedAt:0,finishedAt:0,index:0,draft:[],selectedLeft:null,checked:false,results:[],finishReason:'finished'});
  let state = load();
  let completionReason = state.finishReason || 'finished';
  function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE)||'null');if(x&&['intro','quiz','result'].includes(x.screen)&&Array.isArray(x.results)&&Number.isInteger(x.index)&&x.index>=0&&x.index<questions.length)return {...emptyState(),...x}}catch(e){}return emptyState()}
  function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}}
  function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function timeText(ms){const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
  function remaining(){return Math.max(0,DURATION-(Date.now()-state.startedAt))}
  function score(){return state.results.reduce((s,x)=>s+x.points,0)}
  function correctCount(){return state.results.filter(x=>x.points===MAX_Q_POINTS).length}
  function zoneIndex(zoneId){return districts.findIndex(x=>x.id===zoneId)}
  function doneForZone(zoneId){return state.results.filter(x=>questions.find(q=>q.id===x.id)?.zone===zoneId)}
  function start(){state=emptyState();state.screen='quiz';state.name=(document.getElementById('nickname')?.value||'').trim().slice(0,30);state.startedAt=Date.now();save();render();tick()}
  function restart(){state=emptyState();save();render();window.scrollTo({top:0,behavior:'smooth'})}
  function finish(reason='finished'){if(state.screen==='result')return;state.screen='result';state.finishedAt=Date.now();completionReason=reason;state.finishReason=reason;state.checked=false;state.draft=[];save();render();window.scrollTo({top:0,behavior:'smooth'})}
  function next(){if(state.index===questions.length-1){finish();return}state.index++;state.checked=false;state.draft=[];state.selectedLeft=null;save();render();window.scrollTo({top:0,behavior:'smooth'})}
  function skip(){if(state.checked)return;state.results.push({id:questions[state.index].id,points:0,skipped:true});save();next()}
  function isReady(q){if(q.type==='single')return state.draft.length===1;if(q.type==='multi')return state.draft.length===q.correct.length;if(q.type==='order')return state.draft.length===q.correct.length;if(q.type==='match')return state.draft.length===q.pairs.length;return false}
  function grade(q){let pts=0,full=false;const a=state.draft;
    if(q.type==='single'){pts=a[0]===q.correct?10:0}
    if(q.type==='multi'){const tp=a.filter(i=>q.correct.includes(i)).length;const fp=a.filter(i=>!q.correct.includes(i)).length;pts=Math.round(Math.max(0,tp-fp)/q.correct.length*10)}
    if(q.type==='order'){pts=Math.round(a.filter((id,i)=>id===q.correct[i]).length/q.correct.length*10)}
    if(q.type==='match'){pts=Math.round(a.filter(pair=>q.pairs.find(p=>p.id===pair.left)?.id===pair.right).length/q.pairs.length*10)}
    full=pts===10;return {points:pts,full};
  }
  function check(){const q=questions[state.index];if(state.checked||!isReady(q))return;const {points}=grade(q);state.results.push({id:q.id,points,skipped:false});state.checked=true;save();render();}
  function choice(i){if(state.checked)return;const q=questions[state.index];if(q.type==='single'){state.draft=[i]}else if(q.type==='multi'){const pos=state.draft.indexOf(i);if(pos>=0)state.draft.splice(pos,1);else if(state.draft.length<q.correct.length)state.draft.push(i)}save();render();}
  function pickStep(id){if(state.checked||state.draft.includes(id))return;state.draft.push(id);save();render()}
  function unpickStep(){if(state.checked)return;state.draft.pop();save();render()}
  function pairClick(side,id){if(state.checked)return;
    if(side==='left'){
      const existing=state.draft.findIndex(p=>p.left===id);
      if(existing>=0)state.draft.splice(existing,1);
      state.selectedLeft=(state.selectedLeft===id)?null:id;
    } else if(state.selectedLeft){
      state.draft=state.draft.filter(p=>p.left!==state.selectedLeft&&p.right!==id);
      state.draft.push({left:state.selectedLeft,right:id});state.selectedLeft=null;
    }
    save();render()
  }
  function resetPairs(){if(state.checked)return;state.draft=[];state.selectedLeft=null;save();render()}
  function tick(){if(state.screen!=='quiz'){timer.classList.add('hidden');return}timer.classList.remove('hidden');const t=remaining();timerValue.textContent=timeText(t);timer.classList.toggle('danger',t<=2*60*1000);if(t<=0)finish('timeout')}
  function introHtml(){return `<section class="intro-grid"><div>
      <div class="eyebrow">FINAL QUEST / 7 РАЙОНОВ</div>

      <div class="statline"><span class="stat-chip">◷ <b>20 минут</b></span><span class="stat-chip">✳ <b>21 задание</b></span><span class="stat-chip">◆ <b>${MAX} очков</b></span></div>
      <label class="input-label" for="nickname">ТВОЙ НИКНЕЙМ</label>
      <div class="start-row"><input id="nickname" class="name-field" maxlength="30" placeholder="Например, NeoFox" autocomplete="nickname"><button class="cta" id="startButton">НАЧАТЬ МИССИЮ <span aria-hidden="true">↗</span></button></div>
      <p class="tiny-note">Отвечай кликами: выбор, последовательности и пары. Очки видны сразу после проверки; результат — в финале. Никаких аккаунтов и входа.</p>
    </div><div class="city-card" aria-hidden="true"><div class="city-status">● MISSION SYSTEM // READY</div><div class="city-ring"></div><div class="city-core">AI</div><div class="city-building b1"></div><div class="city-building b2"></div><div class="city-building b3"></div><div class="city-building b4"></div><div class="city-footer"><div><span>ДОСТУП К ГОРОДУ</span><b>7 / 7 DISTRICTS</b></div><span class="online-dot"></span></div></div></section>`}
  function stageStrip(){const current=zoneIndex(questions[state.index].zone);return `<div class="level-strip" aria-label="Прогресс по районам">${districts.map((d,i)=>`<div class="level-node ${i===current?'active':i<current?'passed':''}" ${i===current?'aria-current="step"':''} title="${esc(d.name)}"><span class="glyph">${esc(d.symbol)}</span><small>${esc(d.short)}</small></div>`).join('')}</div>`}
  function choiceHtml(q){const multi=q.type==='multi';return `<div class="answers" role="group" aria-label="Варианты ответа">${q.options.map((opt,i)=>{const chosen=state.draft.includes(i);return `<button class="answer ${chosen?'chosen':''}" data-choice="${i}" type="button" ${state.checked?'disabled':''} aria-pressed="${chosen}"><span class="choice-mark">${chosen?'✓':String.fromCharCode(65+i)}</span><span class="choice-label">${esc(opt)}</span></button>`}).join('')}</div>`}
  function orderHtml(q){return `<div class="sequence-picked" aria-label="Твоя последовательность">${state.draft.length===0?'<span class="placeholder">Твой порядок появится здесь →</span>':state.draft.map((id,i)=>`<span class="picked-step"><span class="step-counter">${i+1}</span>${esc(q.steps.find(s=>s.id===id)?.label||'')}</span>`).join('')}</div><div class="sequence-list" aria-label="Доступные шаги">${q.steps.map(s=>`<button type="button" class="step" data-step="${esc(s.id)}" ${state.draft.includes(s.id)||state.checked?'disabled':''}>＋ ${esc(s.label)}</button>`).join('')}</div><button class="micro-action" id="undoStep" ${state.draft.length===0||state.checked?'disabled':''}>↶ Отменить последний</button>`}
  function matchHtml(q){const pairedLeft=id=>state.draft.find(p=>p.left===id);const pairedRight=id=>state.draft.find(p=>p.right===id);const indexOfPair=id=>state.draft.findIndex(p=>p.left===id||p.right===id);return `<div class="pair-head"><span>ПОНЯТИЕ</span><span>ЗНАЧЕНИЕ</span></div><div class="matching"><div class="match-col">${q.pairs.map(p=>{const linked=pairedLeft(p.id);const n=indexOfPair(p.id);return `<button type="button" data-pair-left="${p.id}" class="match-btn ${linked?'matched':state.selectedLeft===p.id?'selected':''}" aria-pressed="${state.selectedLeft===p.id}"><span class="pair-num">${n>=0?n+1:'•'}</span>${esc(p.left)}</button>`}).join('')}</div><div class="match-col">${q.rightOrder.map(id=>{const p=q.pairs.find(p=>p.id===id);const linked=pairedRight(id);const n=indexOfPair(id);return `<button type="button" data-pair-right="${id}" class="match-btn ${linked?'matched':''}" ${state.checked?'disabled':''}><span class="pair-num">${n>=0?n+1:'•'}</span>${esc(p.right)}</button>`}).join('')}</div></div><button class="micro-action" id="resetPairs" ${state.draft.length===0||state.checked?'disabled':''}>↶ Сбросить пары</button>`}
  function questionHtml(q){if(['single','multi'].includes(q.type))return choiceHtml(q);if(q.type==='order')return orderHtml(q);return matchHtml(q)}
  function questionTypeLabel(q){if(q.type==='multi')return `ВЫБЕРИ ${q.correct.length}`;return {single:'ОДИН ОТВЕТ',order:'СОБЕРИ ПОРЯДОК',match:'НАЙДИ ПАРЫ'}[q.type]}
  function quizHtml(){const q=questions[state.index],d=districts[zoneIndex(q.zone)],points=score(),done=state.results.length;
    let feedback='';if(state.checked){const r=state.results[state.results.length-1];const line=r.points===10?'ИДЕАЛЬНО!':r.points>0?'ЕСТЬ ПОПАДАНИЯ':'ПОКА НЕ ПОПАЛ';feedback=`<div class="feedback ${r.points===10?'':'is-wrong'}" role="status"><strong>${line} · +${r.points} / 10</strong><p>${esc(q.explain)}</p></div>`}
    return `<section class="game">${stageStrip()}<div class="mobile-summary"><span>${esc(d.name)} · уроки ${esc(q.lesson)}</span><strong>${points} / ${MAX} ОЧКОВ</strong></div><div class="game-layout"><section class="question-card" aria-labelledby="question-title"><div class="q-top"><span class="q-index">МИССИЯ ${String(state.index+1).padStart(2,'0')} / ${questions.length} · УРОКИ ${esc(q.lesson)}</span><span class="q-kind">${questionTypeLabel(q)}</span></div><h2 class="q-title" id="question-title">${esc(q.title)}</h2><p class="q-subtitle">${esc(q.subtitle)}</p><div class="answer-area">${questionHtml(q)}${feedback}</div><div class="q-bottom">${state.checked?`<span class="side-mini">Задание ${state.index+1} завершено ✓</span>`:`<button class="soft-btn" id="skipButton">Пропустить</button>`}<button class="cta" id="actionButton" ${!state.checked&&!isReady(q)?'disabled':''}>${state.checked?(state.index===questions.length-1?'СМОТРЕТЬ РЕЗУЛЬТАТ ↗':'СЛЕДУЮЩЕЕ ЗАДАНИЕ →'):'ПРОВЕРИТЬ ОТВЕТ ↗'}</button></div></section><aside class="side-column"><div class="side-card"><p class="side-label">ТВОИ ОЧКИ</p><div class="side-score">${points} <span>/ ${MAX}</span></div><div class="progress-track"><div class="progress-fill" style="width:${done/questions.length*100}%"></div></div><div class="side-mini">Пройдено ${done} из ${questions.length}</div></div><div class="side-card"><div class="district-symbol">${esc(d.symbol)}</div><p class="side-label">РАЙОН ${zoneIndex(q.zone)+1} / 7</p><h3 class="side-district">${esc(d.name)}</h3><p class="side-desc">${esc(d.description)}</p></div></aside></div></section>`
  }
  function rank(scoreValue){const pct=scoreValue/MAX;if(pct>=.85)return {title:'АРХИТЕКТОР НЕЙРОПОЛИСА',tag:'ЛЕГЕНДА ГОРОДА'};if(pct>=.65)return {title:'ПРОМПТ-КАПИТАН',tag:'ПРОФИ В ДЕЛЕ'};if(pct>=.4)return {title:'НЕЙРО-ИССЛЕДОВАТЕЛЬ',tag:'СИЛЬНЫЙ СТАРТ'};return {title:'ИСКАТЕЛЬ ТЕХНОЛОГИЙ',tag:'МИССИЯ ПРОЙДЕНА'}}
  function resultText(){const pts=score(),percent=Math.round(pts/MAX*100);return `Нейрополис · Финальная миссия\n${state.name||'Игрок'}\nРезультат: ${pts} / ${MAX} (${percent}%)\nВерных заданий: ${correctCount()} из ${questions.length}\n${districts.map(d=>{const s=doneForZone(d.id).reduce((sum,x)=>sum+x.points,0);return `${d.name}: ${s} / 30`}).join('\n')}`}
  async function copyResult(){const value=resultText();try{await navigator.clipboard.writeText(value)}catch(e){const t=document.createElement('textarea');t.value=value;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();document.execCommand('copy');t.remove()}const btn=document.getElementById('copyButton');if(btn){btn.textContent='✓ РЕЗУЛЬТАТ СКОПИРОВАН';setTimeout(()=>{if(document.getElementById('copyButton'))document.getElementById('copyButton').textContent='КОПИРОВАТЬ РЕЗУЛЬТАТ'},1900)}}
  function resultHtml(){const pts=score(),pct=Math.round(pts/MAX*100),r=rank(pts),missing=questions.filter(q=>!state.results.some(a=>a.id===q.id&&a.points===10));const played=state.results.length;return `<section class="result-page"><div class="result-heading"><div class="eyebrow">MISSION COMPLETE // ${completionReason==='timeout'?'ВРЕМЯ ВЫШЛО':'ФИНИШ'}</div><h1 class="result-title">ГОРОД <span>ПРОЙДЕН.</span></h1><p class="result-desc">${state.name?`Игрок <b>${esc(state.name)}</b> · `:''}${played} из ${questions.length} заданий · ${correctCount()} выполнено на максимум</p></div><div class="result-grid"><div class="result-card"><p class="side-label">ТВОЙ ИТОГОВЫЙ СЧЁТ</p><div class="score-show">${pts}<span> / ${MAX}</span></div><div class="score-pct">${pct}% ОТ МАКСИМУМА</div><div class="progress-track" style="height:12px;margin:20px 0 25px"><div class="progress-fill" style="width:${pct}%"></div></div><span class="eyebrow">${r.tag}</span><div class="big-rank">${r.title}</div><p class="side-mini muted">Это твой уровень на финише курса. Можно попробовать ещё раз.</p><div class="result-actions"><button class="cta" id="copyButton">КОПИРОВАТЬ РЕЗУЛЬТАТ</button><button class="soft-btn" id="restartButton">↻ ПРОЙТИ ЗАНОВО</button></div></div><div class="result-card"><p class="side-label">КАРТА ТВОИХ НАВЫКОВ · 7 РАЙОНОВ</p><div class="region-list">${districts.map(d=>{const p=doneForZone(d.id).reduce((s,x)=>s+x.points,0);return `<div><div class="region-line"><span>${esc(d.symbol)} &nbsp;${esc(d.name)}</span><b>${p} / 30</b></div><div class="region-progress"><span style="width:${100*p/30}%"></span></div></div>`}).join('')}</div><div class="result-details"><p class="side-label">${missing.length===0?'ВСЁ ВЫПОЛНЕНО НА 100%':'ЧТО МОЖНО ПРОКАЧАТЬ'}</p>${missing.length?`<ul class="review-list">${missing.map(q=>{const a=state.results.find(x=>x.id===q.id);return `<li><b>№${q.id} · ${esc(districts[zoneIndex(q.zone)].name)}</b> — ${esc(q.explain)} <span class="muted">(${a?.points??0}/10)</span></li>`}).join('')}</ul>`:'<p class="side-mini">Отличный результат — все задания выполнены на максимум!</p>'}</div></div></div></section>`}
  function render(){if(state.screen==='intro')app.innerHTML=introHtml();else if(state.screen==='quiz')app.innerHTML=quizHtml();else app.innerHTML=resultHtml();timer.classList.toggle('hidden',state.screen!=='quiz');if(state.screen==='quiz')tick()}
  app.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||b.disabled)return;
    if(b.id==='startButton')start();else if(b.id==='actionButton'){if(state.checked)next();else check()}
    else if(b.id==='skipButton')skip();else if(b.id==='undoStep')unpickStep();else if(b.id==='resetPairs')resetPairs();
    else if(b.id==='restartButton')restart();else if(b.id==='copyButton')copyResult();
    else if(b.hasAttribute('data-choice'))choice(Number(b.dataset.choice));
    else if(b.hasAttribute('data-step'))pickStep(b.dataset.step);
    else if(b.hasAttribute('data-pair-left'))pairClick('left',b.dataset.pairLeft);
    else if(b.hasAttribute('data-pair-right'))pairClick('right',b.dataset.pairRight);
  });
  app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nickname'){e.preventDefault();start()}});
  if(state.screen==='quiz'&&remaining()<=0)finish('timeout');else render();
  setInterval(tick,1000);
})();
</script>
</body>
</html>
